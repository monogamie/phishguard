name: Keep backend awake

# Render на бесплатном тарифе усыпляет сервис после 15 минут без
# запросов, и следующий запрос ждёт ~50 секунд, пока контейнер
# поднимется. Пингуем каждые 10 минут, чтобы он не успевал уснуть.
#
# Бьём в /health: он лёгкий, не делает внешних запросов и выведен
# из-под ограничителя частоты.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:        # кнопка «запустить вручную» в интерфейсе GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          URL="https://phishguard-ayrt.onrender.com/health"
          # --max-time 90: холодный старт Render занимает до минуты,
          # и обрывать его на полпути бессмысленно — мы как раз ради
          # него и будим сервис.
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 90 "$URL" || echo 000)
          echo "HTTP $code"
          cat /tmp/body || true
          # Не валим сборку из-за одной неудачи: сеть бывает разной,
          # а красный значок в репозитории каждые десять минут — шум.
          if [ "$code" != "200" ]; then
            echo "::warning::Сервис не ответил 200 (получено $code)"
          fi
